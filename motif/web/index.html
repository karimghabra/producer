<!doctype html>
<meta charset="utf-8">
<title>Motif</title>
<link rel="stylesheet" href="motif.css">
<div id="app">
  <header>
    <h1>MOTIF</h1>
    <div class="transport">
      <button id="rec" class="btn hot">RECORD</button>
      <button id="play" class="btn mint">PLAY</button>
    </div>
    <nav id="views">
      <button data-view="steps" class="tab on">STEPS</button>
      <button data-view="mix" class="tab">MIX</button>
      <button data-view="sound" class="tab">SOUND</button>
    </nav>
    <button id="project" class="project" title="Save, open, or start a new project">
      <label>PROJECT</label><span id="project-name">Untitled</span>
    </button>
    <div class="readouts">
      <div><label>TEMPO</label><span id="r-bpm">--</span></div>
      <div><label>CYCLE</label><span id="r-cycle">--</span></div>
      <div><label>PEAK</label><span id="r-peak">--</span></div>
    </div>
    <div id="link" class="link"></div>
  </header>

  <main>
    <aside id="rail">
      <div class="rail-head"><span>TRACKS</span><span id="track-count">0</span></div>
      <div id="tracks"></div>
      <div class="rail-add">
        <button id="add-drum" class="add">+ DRUM</button>
        <button id="add-synth" class="add">+ SYNTH</button>
      </div>
    </aside>

    <section id="stage">
      <div id="view-steps" class="view on">
        <div id="pattern-bar" class="bar"></div>
        <div id="steps" class="steps"></div>

        <!-- What the fitter heard. Amber is what you played, mint is where it
             landed; the panel exists so the app shows its reasoning instead of
             silently moving your notes. -->
        <div id="take" class="take">
          <div class="take-head">
            <span class="take-title">TAKE</span>
            <div id="take-stats" class="take-stats"></div>
          </div>
          <canvas id="take-canvas"></canvas>
          <div id="take-controls" class="take-controls"></div>
          <div id="take-empty" class="take-empty">
            Arm a track, hit <b>RECORD</b>, and play on <b>A</b>&ndash;<b>K</b>.
            Hit <b>RECORD</b> again and Motif works out the tempo, the grid and
            the shuffle you were feeling, then lays your take onto it.
          </div>
        </div>
      </div>
      <div id="view-mix" class="view"><div id="mixer" class="mixer"></div></div>
      <div id="view-sound" class="view">
        <div id="preset-bar" class="bar wrap"></div>
        <div id="params" class="params"></div>
      </div>
    </section>
  </main>

  <footer>
    <div id="keys" class="keys"></div>
    <div class="hint">A-K plays the armed track &nbsp;|&nbsp; SPACE play &nbsp;|&nbsp; R record</div>
  </footer>
</div>
<script src="motif.js"></script>
